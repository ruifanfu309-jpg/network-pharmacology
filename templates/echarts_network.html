<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>成分-靶点关联网络图</title>
<!-- 力导向网络图模板：把 nodes / links 替换为真实靶点预测数据即可 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI','Microsoft YaHei',sans-serif;padding:20px}
.w{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:22px;color:#c4b5fd;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:#64748b;margin-bottom:16px}
#net{width:100%;height:720px;background:#111827;border:1px solid #1e293b;border-radius:12px}
.legend{display:flex;justify-content:center;gap:24px;margin:12px 0;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px;color:#94a3b8}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.footer{text-align:center;color:#475569;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div class="w">
<h1>🧬 成分-靶点关联网络图</h1>
<p class="sub">候选活性成分 ↔ 靶点 · 力导向布局（可拖拽）</p>
<div class="legend">
  <span><span class="dot" style="background:#8b5cf6"></span> 活性成分</span>
  <span><span class="dot" style="background:#34d399"></span> 靶点</span>
  <span><span class="dot" style="background:#fbbf24"></span> 核心靶点(度≥3)</span>
</div>
<div id="net"></div>
<div class="footer">网络药理学 · 成分-靶点网络</div>
</div>
<script>
// === 替换为真实数据 ===
const nodes = [
  // {name:'成分A', category:0},
  // {name:'靶点X', category:1},
];
const links = [
  // {source:'成分A', target:'靶点X'},
];
const categories = [
  {name:'活性成分', itemStyle:{color:'#8b5cf6'}},
  {name:'靶点', itemStyle:{color:'#34d399'}},
];
// 计算度数，标记核心靶点（度>=3 放大+变色）
const degree = {};
links.forEach(l => { degree[l.source]=(degree[l.source]||0)+1; degree[l.target]=(degree[l.target]||0)+1; });
nodes.forEach(n => {
  if (degree[n.name] >= 3 && n.category === 1) { n.itemStyle={color:'#fbbf24'}; n.symbolSize=30; }
  else if (n.category === 1) n.symbolSize = 20;
  else n.symbolSize = 14;
});

echarts.init(document.getElementById('net')).setOption({
  tooltip: {formatter: p => `${p.dataType==='edge'?'关联':'节点'}: ${p.name || (p.data.source+' → '+p.data.target)}`},
  legend: {data:['活性成分','靶点'], textStyle:{color:'#94a3b8'}, bottom:10},
  series: [{
    type:'graph', layout:'force',
    data:nodes, links:links, categories:categories,
    roam:true, draggable:true,
    label:{show:true, position:'right', color:'#e2e8f0', fontSize:10},
    force:{repulsion:180, edgeLength:[60,120], gravity:0.1},
    lineStyle:{color:'#475569', width:1, opacity:0.6, curveness:0.05},
    emphasis:{focus:'adjacency', lineStyle:{width:3, color:'#fbbf24'}}
  }]
});
</script>
</body>
</html>
